<script>
// Background: a chip in a cube — geometry only, the engine is shared.
startBackground("bg-chips", function (pts, rng, W, H) {
  // A chip in a cube: dotted rings inside a ledger block.
  dotCube(pts, rng, 0, 0, 0, 40, 5);
  for (var ring = 0; ring <= 5; ring++) {
    var rr = 30 * ring / 5, nn = ring === 0 ? 1 : ring * 8;
    for (var k = 0; k < nn; k++) {
      var a = k / nn * Math.PI * 2;
      pts.push([Math.cos(a) * rr + (rng() - 0.5) * 3, Math.sin(a) * rr + (rng() - 0.5) * 3, (rng() - 0.5) * 3]);
    }
  }
}
, function (W, H) {
  // Fixed field: population from world area and spacing,
  // positions from a seeded pool. Viewports crop; nothing regenerates.
  var spots = scatterLayout(320, 64, 22);
  var homes = [];
  for (var i = 0; i < spots.length; i++) {
    homes.push({
      x: spots[i][0],
      y: spots[i][1],
      rx: Math.random() * Math.PI * 2, ry: Math.random() * Math.PI * 2, rz: Math.random() * Math.PI * 2,
      sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.2, sz: (Math.random() - 0.5) * 0.15
    });
  }
  return homes;
}
, Math.sqrt(3) * 40);
</script>
