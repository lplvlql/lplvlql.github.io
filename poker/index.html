<script>
// Background: poker chips — geometry only, the engine is shared.
startBackground("bg-chips", function (pts, rng, W, H) {
  // One poker chip: dots on concentric rings with jitter.
  var CR = 38, ring, k, nn, a, rr;
  for (ring = 0; ring <= 5; ring++) {
    rr = CR * ring / 5;
    nn = ring === 0 ? 1 : ring * 8;
    for (k = 0; k < nn; k++) {
      a = k / nn * Math.PI * 2;
      pts.push([
        Math.cos(a) * rr + (rng() - 0.5) * 4,
        Math.sin(a) * rr + (rng() - 0.5) * 4,
        (rng() - 0.5) * 3
      ]);
    }
  }
}
, function (W, H) {
  // Random but well distributed: the screen is a 4x4 grid, one
  // chip per shuffled cell at a random spot inside it, with fully
  // random rotations and spin on every load. They stay where
  // they start: rotation and interaction only, no travelling.
  var cells = [];
  for (var gy = 0; gy < 4; gy++) for (var gx = 0; gx < 4; gx++) cells.push([gx, gy]);
  for (var ci = cells.length - 1; ci > 0; ci--) {
    var cj = Math.floor(Math.random() * (ci + 1));
    var tmp = cells[ci]; cells[ci] = cells[cj]; cells[cj] = tmp;
  }
  var cards = [];
  for (var i = 0; i < 16; i++) {
    cards.push({
      x: (cells[i][0] + 0.2 + Math.random() * 0.6) / 4,
      y: (cells[i][1] + 0.2 + Math.random() * 0.6) / 4,
      rx: Math.random() * Math.PI * 2, ry: Math.random() * Math.PI * 2, rz: Math.random() * Math.PI * 2,
      sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.2, sz: (Math.random() - 0.5) * 0.15,
    });
  }
  return cards;
}
, 38);
</script>
