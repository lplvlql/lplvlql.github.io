<script src="../engine.js?v=14"></script>
<script>
// Background: a chip in a cube
startBackground(scatterHomes(320), function (pts, rng) {
  var radius = dotCube(pts, rng, 40, 5);
  for (var ring = 0; ring <= 5; ring++) {
    var rr = 30 * ring / 5, nn = ring === 0 ? 1 : ring * 8;
    for (var k = 0; k < nn; k++) {
      var a = k / nn * Math.PI * 2;
      pts.push([Math.cos(a) * rr + (rng() - 0.5) * 3, Math.sin(a) * rr + (rng() - 0.5) * 3, (rng() - 0.5) * 3]);
    }
  }
  return radius;
});
</script>
