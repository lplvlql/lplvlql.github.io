<script>
// Background: one sphere of connected points
// One home at the centre, tilted 15 degrees, a full turn every 150 s.
startBackground([{ x: 0.5, y: 0.5, z: 0, rx: Math.PI / 12, ry: 0, rz: 0, sx: 0, sy: Math.PI * 2 / 150, sz: 0 }], function (pts, rng) {
  // A Fibonacci sphere with seeded jitter: irregular but evenly spread.
  // Just wide enough to hold the buttons, with evenly spaced dots.
  var buttons = document.querySelector("nav");
  var R = Math.hypot(buttons.offsetWidth, buttons.offsetHeight) / 2, Y = Math.round(R * R / 38);
  for (var i = 0; i < Y; i++) {
    var y = 1 - (i + 0.5) / Y * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), t = i * 2.4;
    var x = Math.cos(t) * r + (rng() - 0.5) * 0.03, z = Math.sin(t) * r + (rng() - 0.5) * 0.03;
    var l = Math.sqrt(x * x + y * y + z * z);
    pts.push([x / l * R, y / l * R, z / l * R]);
  }
  return R;
});
</script>
