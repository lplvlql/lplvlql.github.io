<script>
// Background: one sphere of connected points — geometry only, the engine is shared.
startBackground("bg-canvas", function (pts, rng, W, H) {
  // A Fibonacci sphere with seeded jitter: irregular but evenly spread.
  var Y = 3000, R = Math.min(W, H) * 0.375;
  for (var i = 0; i < Y; i++) {
    var y = 1 - (i + 0.5) / Y * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), t = i * 2.4;
    var x = Math.cos(t) * r + (rng() - 0.5) * 0.03, z = Math.sin(t) * r + (rng() - 0.5) * 0.03;
    var l = Math.sqrt(x * x + y * y + z * z);
    pts.push([x / l * R, y / l * R, z / l * R]);
  }
}
, function (W, H) {
  // One home at the centre, tilted 15 degrees, a full turn every 150 s.
  return [{ x: 0.5, y: 0.5, rx: Math.PI / 12, ry: 0, rz: 0, sx: 0, sy: Math.PI * 2 / 150, sz: 0 }];
}
, Math.min(innerWidth, innerHeight) * 0.375);
</script>
