<script>
// Background: a peer network — geometry only, the engine is shared.
startBackground("bg-peers", function (pts, rng, W, H) {

  // One hash ring as dot homes, in local coords about the
  // origin: peers as small dotted balls on a circle, each
  // joined to its two ring neighbours by dotted segments. Peer
  // count scales with ring circumference. One ring around the
  // hero: rotation and interaction only, no travelling.
  var RR = Math.min(W, H) * 0.31;
  var NP = Math.max(8, Math.min(24, Math.round(2 * Math.PI * RR / 96)));
  var PR = 8, PER = 80, SEG = 40;
  var p, k, th, ph, s, u, A, B;
  var peers = [];
  for (p = 0; p < NP; p++) {
    th = (p / NP) * Math.PI * 2;
    peers.push([RR * Math.cos(th), RR * Math.sin(th), (rng() - 0.5) * 8]);
  }
  for (p = 0; p < NP; p++) {
    for (k = 0; k < PER; k++) {
      th = rng() * Math.PI * 2; ph = Math.acos(2 * rng() - 1);
      pts.push([
        peers[p][0] + PR * Math.sin(ph) * Math.cos(th),
        peers[p][1] + PR * Math.sin(ph) * Math.sin(th),
        peers[p][2] + PR * Math.cos(ph)
      ]);
    }
  }
  // Segments: each peer joins its two ring neighbours with a
  // dense, near-straight dotted line the engine links into a chain.
  for (p = 0; p < NP; p++) {
    A = peers[p]; B = peers[(p + 1) % NP];
    for (s = 0; s <= SEG; s++) {
      u = s / SEG;
      pts.push([
        A[0] + (B[0] - A[0]) * u + (rng() - 0.5),
        A[1] + (B[1] - A[1]) * u + (rng() - 0.5),
        A[2] + (B[2] - A[2]) * u + (rng() - 0.5)
      ]);
    }
  }
}
, function (W, H) {
  return [{ x: 0.5, y: 0.5, rx: 0.25, ry: 0.1, rz: Math.random() * Math.PI * 2, sx: 0.02, sy: 0.015, sz: 0.06 }];
}
, 224);
</script>
