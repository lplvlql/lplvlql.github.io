<script>
// Background: small cubes — geometry only, the engine is shared.
startBackground("bg-pocket", function (pts, rng, W, H) {
  // Small cubes: pocket-sized blocks of the ledger family.
  dotCube(pts, rng, 0, 0, 0, 16, 4);
}
, function (W, H) {
  // Fixed field: population from world area and spacing,
  // positions from a seeded pool. Viewports crop; nothing regenerates.
  var spots = scatterLayout(224, 64, 55);
  var homes = [];
  for (var i = 0; i < spots.length; i++) {
    homes.push({
      x: spots[i][0],
      y: spots[i][1],
      rx: Math.random() * Math.PI * 2, ry: Math.random() * Math.PI * 2, rz: Math.random() * Math.PI * 2,
      sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.2, sz: (Math.random() - 0.5) * 0.15
    });
  }
  return homes;
}
, Math.sqrt(3) * 16);
</script>
