<script>
// Background: parcels — geometry only, the engine is shared.
startBackground("bg-parcels", function (pts, rng, W, H) {

  // One parcel as dot homes: an open-top box — dotted bottom and
  // four sides, no top face, with four short flaps angled outward
  // from the top edges. Reads as a parcel, not a die.
  var W2 = 42, D2 = 42, H = 48, FL = 32, FA = 0.9, G = 7, GH = 8, GF = 3;
  var i, j, ac, ht, fc, ft, ox, oz, fj;
  for (i = 0; i < G; i++) for (j = 0; j < G; j++) { // bottom
    ac = -W2 + (i + 0.5) * 2 * W2 / G + (rng() - 0.5) * 2;
    ht = -D2 + (j + 0.5) * 2 * D2 / G + (rng() - 0.5) * 2;
    pts.push([ac, ht, -H / 2]);
  }
  for (i = 0; i < G; i++) for (j = 0; j < GH; j++) { // four sides
    ac = (i + 0.5) / G * 2 - 1;
    ht = -H / 2 + (j + 0.5) / GH * H + (rng() - 0.5) * 2;
    fj = (rng() - 0.5) * 2;
    pts.push([W2, ac * D2 + fj, ht]);
    pts.push([-W2, ac * D2 + fj, ht]);
    pts.push([ac * W2 + fj, D2, ht]);
    pts.push([ac * W2 + fj, -D2, ht]);
  }
  var co = Math.cos(FA), si = Math.sin(FA);
  for (i = 0; i < G; i++) for (j = 0; j < GF; j++) { // four flaps
    fc = (i + 0.5) / G * 2 - 1;
    ft = (j + 0.5) / GF * FL;
    ox = W2 + ft * si; oz = H / 2 + ft * co;
    fj = (rng() - 0.5) * 2;
    pts.push([ox, fc * D2 + fj, oz]);
    pts.push([-ox, fc * D2 + fj, oz]);
    pts.push([fc * W2 + fj, ox, oz]);
    pts.push([fc * W2 + fj, -ox, oz]);
  }
}
, function (W, H) {
  // Fixed field: population from world area and parcel spacing,
  // positions from a seeded pool. Viewports crop; nothing regenerates.
  var spots = scatterLayout(336, 64, 44);
  var cards = [];
  for (var i = 0; i < spots.length; i++) {
    cards.push({
      x: spots[i][0],
      y: spots[i][1],
      rx: Math.random() * Math.PI * 2, ry: Math.random() * Math.PI * 2, rz: Math.random() * Math.PI * 2,
      sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.2, sz: (Math.random() - 0.5) * 0.15
    });
  }
  return cards;
}
, 96);
</script>
