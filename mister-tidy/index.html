<script>
// Background: dotted SD cards — geometry only, the engine is shared.
startBackground("bg-sdcards", function (pts, rng, W, H) {

  // One SD card as a thin 3D solid: dotted faces, the chamfered
  // corner every SD card has, and nine contact pins along its top
  // edge drawn as small dotted rectangles on the top face.
  var CW = 84, CH = 110, CD = 6, i, j, k;
  function inside(x, y) { return !(x + (-y) > 78); } // the chamfer cut
  function face(nx, ny, z) {
    for (j = 0; j < ny; j++) for (i = 0; i < nx; i++) {
      var x = -CW / 2 + (i + 0.5) * CW / nx + (rng() - 0.5) * 4;
      var y = -CH / 2 + (j + 0.5) * CH / ny + (rng() - 0.5) * 4;
      if (inside(x, y)) pts.push([x, y, z]);
    }
  }
  face(8, 11, CD / 2);
  face(4, 6, -CD / 2);
  for (j = 0; j < 11; j++) { // thin sides
    var sy = -CH / 2 + (j + 0.5) * CH / 11;
    pts.push([-CW / 2, sy, 0]);
    if (inside(CW / 2, sy)) pts.push([CW / 2, sy, 0]);
  }
  for (i = 0; i < 8; i++) {
    var sx = -CW / 2 + (i + 0.5) * CW / 8;
    pts.push([sx, CH / 2, 0]);
    if (inside(sx, -CH / 2)) pts.push([sx, -CH / 2, 0]);
  }
  // 9 contact pins along the top edge.
  for (k = 0; k < 9; k++) {
    var cxp = -36 + k * 9, cyp = -46;
    for (var e = 0; e < 4; e++) {
      pts.push([cxp - 2.5 + e * 1.7, cyp - 7, CD / 2 + 1]);
      pts.push([cxp - 2.5 + e * 1.7, cyp + 7, CD / 2 + 1]);
    }
    pts.push([cxp - 2.5, cyp, CD / 2 + 1]);
    pts.push([cxp + 2.5, cyp, CD / 2 + 1]);
  }
}
, function (W, H) {
  // Fixed field: population from world area and card spacing,
  // positions from a seeded pool. Viewports crop; nothing regenerates.
  var spots = scatterLayout(256, 64, 33);
  var cards = [];
  for (var i = 0; i < spots.length; i++) {
    cards.push({
      x: spots[i][0],
      y: spots[i][1],
      rx: Math.random() * Math.PI * 2, ry: Math.random() * Math.PI * 2, rz: Math.random() * Math.PI * 2,
      sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.2, sz: (Math.random() - 0.5) * 0.15,
    });
  }
  return cards;
}
, Math.sqrt(84 * 84 / 4 + 110 * 110 / 4 + 6 * 6 / 4));
</script>
