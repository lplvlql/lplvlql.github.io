<script>
// Background: pocket parcels — geometry only, the engine is shared.
startBackground("bg-pocket", function (pts, rng, W, H) {

  // Pocket parcels as dot homes: small cubes with dots across all
  // six faces. Same recipe as the cards, pocket-sized.
  var CB = 28, G = 6, i, j, a, b;
  for (i = 0; i < G; i++) for (j = 0; j < G; j++) {
    a = -CB + (i + 0.5) * 2 * CB / G + (rng() - 0.5) * 2;
    b = -CB + (j + 0.5) * 2 * CB / G + (rng() - 0.5) * 2;
    pts.push([CB, a, b]); pts.push([-CB, a, b]);
    pts.push([a, CB, b]); pts.push([a, -CB, b]);
    pts.push([a, b, CB]); pts.push([a, b, -CB]);
  }
}
, function (W, H) {
  // Fixed field: population from world area and parcel spacing,
  // positions from a seeded pool. Viewports crop; nothing regenerates.
  var spots = scatterLayout(336, 64, 55);
  var cards = [];
  for (var i = 0; i < spots.length; i++) {
    cards.push({
      x: spots[i][0],
      y: spots[i][1],
      rx: Math.random() * Math.PI * 2, ry: Math.random() * Math.PI * 2, rz: Math.random() * Math.PI * 2,
      sx: (Math.random() - 0.5) * 0.25, sy: (Math.random() - 0.5) * 0.2, sz: (Math.random() - 0.5) * 0.15
    });
  }
  return cards;
}
, 64);
</script>
